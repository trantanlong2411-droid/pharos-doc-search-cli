name: CLI tests and live MCP evidence
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Automated tests (local mock, not live Pharos)
        run: npm test
      - name: Syntax check
        run: npm run check
  live-docs-mcp-smoke:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query official public Docs MCP and record exact results
        shell: bash
        run: |
          mkdir -p proof
          run_cli() {
            label="$1"
            shift
            node ./bin/pharos-docs.mjs "$@" >"proof/$label.txt" 2>&1
            printf '%s\n' "$?" >"proof/$label.exit"
          }
          run_cli tools --tools
          run_cli deploy "How do I deploy a contract on Pharos?"
          run_cli testnet "What is Pharos Atlantic Testnet?"
          run_cli unknown "Where is the official guide for Quantum Banana X999?"
          for file in proof/*.exit; do echo "$file: $(cat "$file")"; done
          for file in proof/*.txt; do echo "=== $file ==="; cat "$file"; done
          # Keep the proof files even if a remote answer turns out to be irrelevant.
          exit 0
      - name: Validate real results, including the unknown-topic regression
        shell: bash
        run: |
          for label in tools deploy testnet unknown; do
            test "$(cat "proof/$label.exit")" = "0" || { echo "MCP request failed: $label"; exit 1; }
          done
          grep -q 'searchDocumentation' proof/tools.txt
          grep -q 'Sources (returned by MCP)' proof/deploy.txt
          grep -q 'Sources (returned by MCP)' proof/testnet.txt
          grep -q 'No good answer found' proof/unknown.txt
      - name: Upload actual remote results (including any errors)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-docs-mcp-live-results
          path: proof/
          retention-days: 30
